<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt;
  height: 405pt;
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header {
  background: #181B24;
  padding: 30pt 50pt;
}
h1 {
  color: #ffffff;
  font-size: 32pt;
  font-weight: bold;
  margin: 0;
}
.content {
  flex: 1;
  padding: 35pt 50pt 50pt 50pt;
  display: flex;
  gap: 30pt;
}
.column {
  flex: 1;
}
h2 {
  color: #2196F3;
  font-size: 18pt;
  font-weight: bold;
  margin: 0 0 15pt 0;
}
p {
  color: #2C3E50;
  font-size: 13pt;
  line-height: 1.6;
  margin: 0 0 12pt 0;
}
ul {
  color: #2C3E50;
  font-size: 13pt;
  line-height: 1.6;
  margin: 0;
  padding-left: 20pt;
}
.services {
  background: #F4F6F7;
  padding: 12pt;
  border-radius: 6pt;
  margin-top: 10pt;
  border-left: 4pt solid #FF6B35;
}
.services p {
  margin: 0;
  font-weight: bold;
  color: #181B24;
  font-size: 13pt;
}
.services ul {
  font-size: 13pt;
  margin-top: 8pt;
}
</style>
</head>
<body>
<div class="header">
<h1>AI Coding with CI/CD</h1>
</div>
<div class="content">
<div class="column">
<h2>AI coding</h2>
<p>確率論的な生成・推論による実装/修正/レビュー</p>
</div>
<div class="column">
<h2>CI/CD</h2>
<p>決定論的な自動化による修正・検証・デプロイ</p>
</div>
</div>
<div style="padding: 0 50pt 30pt 50pt;">
<div class="services">
<p>GitHub サービス:</p>
<ul>
<li>GitHub Actions (ワークフロー自動化)</li>
<li>Dependabot (依存関係更新)</li>
<li>GitHub Copilot (AI 開発支援)</li>
</ul>
</div>
</div>
</body>
</html>
